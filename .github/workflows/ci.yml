name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  # Test-only secret — production secrets must come from GitHub Actions secrets.
  AUTH_SIGNING_SECRET: "ci-test-secret-must-be-at-least-32-characters-long"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reqy-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (reqy-web)
        run: npx tsc --noEmit

      - name: Type check (sync-server)
        working-directory: sync-server
        run: npx tsc --noEmit

      - name: Type check (reqy-mcp)
        working-directory: reqy-mcp
        run: npx tsc --noEmit

      - name: Type check (recli)
        working-directory: recli
        run: npx tsc --noEmit

      - name: Type check (packages/shared)
        working-directory: packages/shared
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reqy-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reqy-web
        run: pnpm build

      - name: Build sync-server
        working-directory: sync-server
        run: pnpm build

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the full suite: reqy-web, reqy-mcp, sync-server and recli.
      # (Previously this only ran reqy-web's tests, so sync-server/mcp/recli
      # regressions went undetected.)
      - name: Run Vitest (all packages)
        run: pnpm test

  format:
    name: Format (Prettier)
    # Non-blocking for now: 419 files are currently not Prettier-clean.
    # Run `pnpm format` locally, then drop `continue-on-error` to enforce it.
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test

  test-e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reqy-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: reqy-web/playwright-report/
          retention-days: 7
